name: Deploy Website to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔨 Build Project
      # Vite inlines VITE_* at build time, so these must exist here, not on the
      # host. Both are public client keys — never add the service_role key.
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      run: npm run build

    - name: 🚀 Sync Files via FTPS
      # Replaces SamKirkland/FTP-Deploy-Action. That action opens a single
      # control connection with no retry, so any throttle or dropped handshake
      # from Hostinger ends the job as a bare "Timeout (control socket)" with
      # nothing to diagnose from. It was patched three times (11b779e, 96ab96b,
      # 68bf472) and kept failing. lftp retries, reconnects, and logs the FTP
      # dialogue so the next failure names its own cause.
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y lftp

        # Strip any scheme/trailing slash a hand-entered secret may carry —
        # lftp reads "ftp://host/" as a path and never resolves the host.
        HOST=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-z]+://##; s#/+$##')
        echo "Connecting to '$HOST' as '$FTP_USERNAME'"

        # --env-password keeps the password out of the command string, so it
        # never reaches the process list or an lftp parse error.
        export LFTP_PASSWORD="$FTP_PASSWORD"

        # Separate "the network refuses us" from "our FTP call is wrong".
        # Without this, both fail identically and each fix is a guess.
        echo "--- TCP reachability, port 21 ---"
        if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$HOST/21" 2>/dev/null; then
          echo "port 21 is OPEN — the host accepts connections"
        else
          echo "port 21 is UNREACHABLE from this runner."
          echo "Hostinger is refusing or dropping the connection; runner IPs"
          echo "rotate every job, so no FTP setting fixes this. Options:"
          echo "  - enable FTP / clear any IP restriction in hPanel, or"
          echo "  - deploy over SSH-SFTP (Hostinger port 65002) instead."
          exit 1
        fi

        # A script file with an explicit `open` removes every shell-quoting
        # ambiguity. Passing the host as lftp's trailing argument alongside -e
        # left no session open at all — mirror aborted with "Not connected"
        # before a single packet was sent.
        #
        # ssl:verify-certificate no — shared hosting presents the provider
        #   certificate, not the domain certificate, so strict validation
        #   rejects a working server.
        # mirror target is "." not "/" — af0a724 established that the login
        #   directory IS the web root. Uploading to / lands a level too high
        #   and the live site never changes.
        # No --delete — the web root may hold files this build does not
        #   produce (.htaccess, uploads).
        cat > /tmp/deploy.lftp <<SCRIPT
        set ftp:ssl-force true
        set ftp:ssl-protect-data true
        set ssl:verify-certificate no
        set ftp:passive-mode true
        set net:timeout 30
        set net:max-retries 5
        set net:reconnect-interval-base 15
        set cmd:fail-exit true
        debug 3
        open -p 21 $HOST
        user $FTP_USERNAME $FTP_PASSWORD
        mirror -R --verbose --parallel=2 dist/ .
        bye
        SCRIPT

        echo "--- lftp transfer ---"
        lftp -f /tmp/deploy.lftp
