name: Deploy Website to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔨 Build Project
      # Vite inlines VITE_* at build time, so these must exist here, not on the
      # host. Both are public client keys — never add the service_role key.
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      run: npm run build

    - name: 🚀 Sync Files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        # Hostinger disables plain FTP and serves explicit FTPS on port 21.
        # Connecting as plain `ftp` never completes the control handshake,
        # which surfaces as "Error: Timeout (control socket)".
        protocol: ftps
        # Shared hosting presents a certificate for the hosting provider, not
        # for your domain, so strict validation rejects it.
        security: loose
        # The default 30s is tight for a first upload from a cold runner.
        timeout: 120000
        local-dir: ./dist/
        server-dir: ./
